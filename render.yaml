databases:
  - name: packin-db
    databaseName: packin
    user: packin
    plan: free

services:
  - type: web
    name: packin-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: packin-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: HF_API_TOKEN
        sync: false
      - key: HF_VISION_MODEL
        value: Qwen/Qwen2.5-VL-7B-Instruct
      - key: EXTRACTION_PROVIDER_ORDER
        value: gemini,groq,huggingface
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "480"
      - key: BOOTSTRAP_ADMIN_USERNAME
        value: admin
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://packin-ai.vercel.app
