services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: packin
      POSTGRES_USER: packin
      POSTGRES_PASSWORD: packin
    ports:
      - "5432:5432"
    volumes:
      - packin_pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://packin:packin@db:5432/packin
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  packin_pg_data:
